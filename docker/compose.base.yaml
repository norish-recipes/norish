services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: norish
      POSTGRES_DB: norish
    volumes:
      - norish_db_data:/var/lib/postgresql/data

  # Obscura renders recipe pages for URL imports. The image starts its CDP
  # server with stealth on and private-network protection intact, so it needs
  # no command of its own — see docker/obscura/README.md.
  obscura:
    image: norishapp/obscura:0.2.4-norish.2
    restart: unless-stopped
    environment:
      # Development only. .env.example sets the same value for the app.
      OBSCURA_CDP_TOKEN: norish-local-obscura-token-not-for-production

  # Valkey for real-time events
  valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    volumes:
      - norish_valkey_data:/data

volumes:
  norish_db_data:
  norish_valkey_data:
