[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "norish-parser-api"
version = "0.18.0"
description = "Norish FastAPI wrapper around recipe-scrapers"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
  "beautifulsoup4==4.15.0",
  "fastapi==0.165.0",
  "recipe-scrapers==15.14.0",
  "uvicorn==0.54.0",
]

[tool.setuptools]
packages = ["app"]

[dependency-groups]
# Keep in step with DEFAULT_YT_DLP_VERSION in packages/config/src/zod/server-config.ts:
# the image runs this release as /app/bin/yt-dlp, and that constant is the version the server reports.
yt-dlp = ["yt-dlp[default,curl-cffi]==2026.10.26"]
