[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "norish-parser-api"
version = "0.18.0"
description = "Norish FastAPI wrapper around recipe-scrapers"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
  "beautifulsoup4==4.15.0",
  "fastapi==0.162.0",
  "recipe-scrapers==15.13.0",
  "uvicorn==0.54.0",
]

[tool.setuptools]
packages = ["app"]
