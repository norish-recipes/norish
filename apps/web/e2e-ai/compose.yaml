name: norish-web-ai-e2e

# Dedicated Postgres/Redis for the production-like AI E2E harness. Ports are
# distinct from the offline suite (apps/web/e2e) so the two never collide, and
# sit below the OS ephemeral ranges (Linux 32768+, macOS 49152+) so a transient
# client socket left over from the just-finished offline suite can never hold
# them ("address already in use" flakes in CI).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: norish_ai_e2e
      POSTGRES_PASSWORD: norish_ai_e2e
      POSTGRES_USER: norish_ai_e2e
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norish_ai_e2e -d norish_ai_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.6.2-alpine
    ports:
      - "16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 30
