name: norish-web-e2e

# Host ports sit below the OS ephemeral ranges (Linux 32768+, macOS 49152+):
# an ephemeral-range port can be held by a transient client socket left over
# from a sibling suite, which made `compose up` flake in CI with
# "address already in use".
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: norish_e2e
      POSTGRES_PASSWORD: norish_e2e
      POSTGRES_USER: norish_e2e
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norish_e2e -d norish_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.6.2-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 30
