name: norish-web-provenance-e2e

# Dedicated Postgres/Redis for the production-like AI E2E harness. Ports are
# distinct from the offline suite (apps/web/e2e) so the two never collide.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: norish_prov
      POSTGRES_PASSWORD: norish_prov
      POSTGRES_USER: norish_prov
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norish_prov -d norish_prov"]
      interval: 1s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.6.2-alpine
    ports:
      - "56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 30
