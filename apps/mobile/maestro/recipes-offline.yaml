# Cold-launches with the server unreachable: the Library and Today open from what the app kept, and
# a recipe card opens its page.
appId: dev.norish.app
---
- evalScript: "${http.post(NORISH_PROXY_CONTROL_URL + '/restore', { body: '' })}"
- runFlow: subflows/reset.yaml
- runFlow:
    file: subflows/recipe.yaml
    env:
      RECIPE_NAME: Offline Roast
      RECIPE_KEY: roast
- runFlow:
    file: subflows/sign-in.yaml
    env:
      NORISH_SIGN_IN_URL: ${NORISH_PROXY_URL}
- extendedWaitUntil:
    visible:
      id: recipe-card-${output.roast}
    timeout: 20000
# Leaving the app saves what it has read.
- pressKey: home
- evalScript: "${http.post(NORISH_PROXY_CONTROL_URL + '/cut', { body: '' })}"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: recipe-card-${output.roast}
    timeout: 20000
- assertVisible:
    id: today-section
- tapOn:
    id: recipe-card-${output.roast}
- extendedWaitUntil:
    visible:
      id: recipe-name
      text: Offline Roast
    timeout: 20000
- evalScript: "${http.post(NORISH_PROXY_CONTROL_URL + '/restore', { body: '' })}"
