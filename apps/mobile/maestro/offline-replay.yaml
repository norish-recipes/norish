# Cuts the backend, checks off a grocery while Offline, restores it and sees the change replayed.
# `pnpm --filter @norish/mobile maestro` serves the cuttable proxy and checks the server after.
appId: dev.norish.app
---
- runFlow:
    file: subflows/sign-in.yaml
    env:
      NORISH_SIGN_IN_URL: ${NORISH_PROXY_URL}
- scrollUntilVisible:
    element:
      id: smoke-grocery-${NORISH_OFFLINE_GROCERY_ID}
- assertVisible:
    id: smoke-grocery-${NORISH_OFFLINE_GROCERY_ID}
    text: checkbox, unchecked
- evalScript: "${http.post(NORISH_PROXY_CONTROL_URL + '/cut', { body: '' })}"
- extendedWaitUntil:
    visible:
      id: smoke-connection
      text: Offline
    timeout: 20000
- tapOn:
    id: smoke-grocery-${NORISH_OFFLINE_GROCERY_ID}
- extendedWaitUntil:
    visible:
      id: smoke-grocery-${NORISH_OFFLINE_GROCERY_ID}
      text: checkbox, checked
    timeout: 10000
- assertVisible:
    id: smoke-outbox
    text: 1 change waiting
- evalScript: "${http.post(NORISH_PROXY_CONTROL_URL + '/restore', { body: '' })}"
# The Offline backoff tops out at 30 seconds between probes.
- extendedWaitUntil:
    visible:
      id: smoke-connection
      text: Live
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: smoke-outbox
      text: Nothing queued.*
    timeout: 20000
- assertVisible:
    id: smoke-grocery-${NORISH_OFFLINE_GROCERY_ID}
    text: checkbox, checked
