# Deletes a site token by swipe: a swipe across the row is a full swipe, which runs Delete (its only
# action). The row closes and asks; cancelling keeps the token, confirming drops it and the other stays.
appId: dev.norish.app
---
- runFlow: subflows/reset.yaml
- evalScript: "${output.kept = http.post(NORISH_PROXY_CONTROL_URL + '/token', { body: JSON.stringify({ domain: 'tiktok.com' }) }).ok}"
- assertTrue: ${output.kept}
- evalScript: "${output.token = json(http.post(NORISH_PROXY_CONTROL_URL + '/token', { body: JSON.stringify({ domain: 'facebook.com' }) }).body).id}"
- runFlow: subflows/sign-in.yaml
- runFlow: subflows/open-settings.yaml
- tapOn:
    id: settings-root-tokens
- extendedWaitUntil:
    visible:
      id: settings-tokens-item-${output.token}
    timeout: 20000
- swipe:
    from:
      id: settings-tokens-item-${output.token}
    direction: LEFT
- tapOn: Cancel
- assertVisible:
    id: settings-tokens-item-${output.token}
- swipe:
    from:
      id: settings-tokens-item-${output.token}
    direction: LEFT
# The native confirm's button, after its title of the same name.
- tapOn:
    text: Delete token
    index: 1
- extendedWaitUntil:
    notVisible:
      id: settings-tokens-item-${output.token}
    timeout: 20000
- evalScript: ${output.tokens = json(http.get(NORISH_PROXY_CONTROL_URL + '/tokens?is=' + encodeURIComponent('["tiktok.com"]')).body).is}
- assertVisible: tiktok.com
