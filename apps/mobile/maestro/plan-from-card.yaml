# Plans a recipe from its card: swipe, Plan, the day Today shows in the mini calendar, in the slot of
# the empty card Today shows. Planning opens Add to groceries, the default after planning; once closed,
# Today shows the recipe on a card. Slot and day come from what the app shows, not from the clock.
appId: dev.norish.app
---
- runFlow:
    file: subflows/start.yaml
    env:
      RECIPES: '[{"name": "Plan Card Curry", "key": "curry", "ingredients": ["2 eggs", "100 g flour"]}]'
- extendedWaitUntil:
    visible:
      id: recipe-card-${output.curry}
    timeout: 20000
# An empty card reads "Add recipe, <slot>".
- extendedWaitUntil:
    visible:
      id: today-add-.*
    timeout: 20000
- copyTextFrom:
    id: today-add-.*
- evalScript: ${output.slot = maestro.copiedText.split(', ').pop()}
# Today's date reads "Saturday, Nov 14"; the day's "+" ends "on Sat, Nov 14".
- copyTextFrom:
    id: today-date
- evalScript: ${output.day = maestro.copiedText.split(', ').pop()}
- swipe:
    from:
      id: recipe-card-${output.curry}
    direction: LEFT
- tapOn:
    id: recipe-swipe-plan-${output.curry}
- extendedWaitUntil:
    visible:
      id: day-add-.*
      text: .* ${output.day}
    timeout: 20000
- tapOn:
    id: day-add-.*
    text: .* ${output.day}
- tapOn:
    id: day-add-.*-${output.slot}
- runFlow:
    file: subflows/planned.yaml
    env:
      PLANNED_NAME: Plan Card Curry
