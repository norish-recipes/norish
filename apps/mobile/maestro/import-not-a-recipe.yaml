# Imports a link that is not a recipe: the failure toast carries the reason, and no recipe lands.
appId: dev.norish.app
---
- runFlow: subflows/start.yaml
- extendedWaitUntil:
    visible:
      id: add-recipe
    timeout: 20000
- runFlow:
    file: subflows/import-link.yaml
    env:
      IMPORT_URL: ${NORISH_NOT_A_RECIPE_URL}
- extendedWaitUntil:
    visible:
      id: toast
    timeout: 60000
- assertVisible: .*${NORISH_COPY_NOT_A_RECIPE}.*
