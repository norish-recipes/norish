# A confirmed search is kept under Recent: tapping it runs it again, and Clear empties the list.
appId: dev.norish.app
---
- runFlow:
    file: subflows/start.yaml
    env:
      RECIPES: '[{"name": "Lentil Soup", "key": "soup"}, {"name": "Berry Tart", "key": "tart"}]'
- extendedWaitUntil:
    visible:
      id: recipe-card-${output.soup}
    timeout: 20000
- tapOn: Search
- extendedWaitUntil:
    visible:
      id: search-screen
    timeout: 10000
- inputText: lentil
- extendedWaitUntil:
    visible:
      id: search-for-row
    timeout: 10000
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: search-count
    timeout: 20000
# Clearing the field rests Search; the confirmed text is under Recent.
- tapOn: Clear text
- extendedWaitUntil:
    visible:
      id: search-recent-0
    timeout: 10000
- assertVisible:
    text: lentil
- assertNotVisible:
    id: search-results
# Tapping it runs the search again.
- tapOn:
    id: search-recent-0
- extendedWaitUntil:
    visible:
      id: search-count
      text: 1 recipe.*
    timeout: 20000
- assertVisible:
    id: recipe-card-${output.soup}
- assertNotVisible:
    id: recipe-card-${output.tart}
# Clear empties the list: no Recent section is left.
- tapOn: Clear text
- extendedWaitUntil:
    visible:
      id: search-recent-clear
    timeout: 10000
- tapOn:
    id: search-recent-clear
- extendedWaitUntil:
    notVisible:
      id: search-recent
    timeout: 10000
- assertNotVisible:
    id: search-recent-0
