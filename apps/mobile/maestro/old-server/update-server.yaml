# Points the app at a server reporting an older version and lands on the update screen naming
# both versions, with no sign-in. `pnpm --filter @norish/mobile maestro` serves that old server.
appId: dev.norish.app
---
- runFlow:
    file: ../subflows/connect.yaml
    env:
      NORISH_CONNECT_URL: ${NORISH_OLD_SERVER_URL}
- extendedWaitUntil:
    visible:
      id: update-server-description
      text: .*${NORISH_OLD_SERVER_HOST}.*${NORISH_OLD_SERVER_VERSION}.*${NORISH_MINIMUM_SERVER_VERSION}.*
    timeout: 10000
- assertNotVisible:
    id: login-submit
