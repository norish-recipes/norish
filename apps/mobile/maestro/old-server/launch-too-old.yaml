# Signed out with a saved server that has become too old: a relaunch, without clearing state,
# opens Update your server naming both versions.
appId: dev.norish.app
---
- evalScript: "${http.post(NORISH_PROXY_CONTROL_URL + '/real', { body: '' })}"
- runFlow:
    file: ../subflows/connect.yaml
    env:
      NORISH_CONNECT_URL: ${NORISH_VERSION_PROXY_URL}
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 20000
- evalScript: "${http.post(NORISH_PROXY_CONTROL_URL + '/old', { body: '' })}"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: update-server-description
      text: .*${NORISH_VERSION_PROXY_HOST}.*${NORISH_OLD_SERVER_VERSION}.*${NORISH_MINIMUM_SERVER_VERSION}.*
    timeout: 20000
- assertVisible: ${NORISH_COPY_UPDATE_SERVER_TITLE}
- assertNotVisible:
    id: login-submit
- evalScript: "${http.post(NORISH_PROXY_CONTROL_URL + '/real', { body: '' })}"
