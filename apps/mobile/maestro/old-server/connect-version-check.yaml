# Connect's version check: a server reporting an older version leads to Update your server,
# which names both versions, with no sign-in. The version proxy says "too old" after `/old`.
appId: dev.norish.app
---
- evalScript: "${http.post(NORISH_PROXY_CONTROL_URL + '/old', { body: '' })}"
- runFlow:
    file: ../subflows/connect.yaml
    env:
      NORISH_CONNECT_URL: ${NORISH_VERSION_PROXY_URL}
- extendedWaitUntil:
    visible:
      id: update-server-description
      text: .*${NORISH_VERSION_PROXY_HOST}.*${NORISH_OLD_SERVER_VERSION}.*${NORISH_MINIMUM_SERVER_VERSION}.*
    timeout: 10000
- assertNotVisible:
    id: login-submit
- evalScript: "${http.post(NORISH_PROXY_CONTROL_URL + '/real', { body: '' })}"
