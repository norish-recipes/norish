# Adds a recipe's ingredients to groceries from its card: swipe, Groceries, Add. The sheet closes and
# the server has the two lines.
appId: dev.norish.app
---
- runFlow:
    file: subflows/start.yaml
    env:
      RECIPES: '[{"name": "Grocery Omelette", "key": "omelette", "ingredients": ["2 eggs", "100 g flour"]}]'
- extendedWaitUntil:
    visible:
      id: recipe-card-${output.omelette}
    timeout: 20000
- swipe:
    from:
      id: recipe-card-${output.omelette}
    direction: LEFT
- tapOn:
    id: recipe-swipe-groceries-${output.omelette}
- extendedWaitUntil:
    visible:
      id: add-to-groceries-add
    timeout: 20000
- tapOn:
    id: add-to-groceries-add
- extendedWaitUntil:
    notVisible:
      id: add-to-groceries-sheet
    timeout: 20000
# The server answers once both lines are there.
- evalScript: ${output.groceries = json(http.get(NORISH_PROXY_CONTROL_URL + '/groceries?min=2').body).names}
- assertTrue: ${output.groceries.length == 2}
