# Imports the link in IMPORT_URL, which callers pass via runFlow env: Add recipe, From a link, Import.
appId: dev.norish.app
---
- tapOn:
    id: add-recipe
- tapOn:
    id: add-recipe-link
- extendedWaitUntil:
    visible:
      id: import-link-field
    timeout: 20000
- inputText: ${IMPORT_URL}
# Import is the sheet's native header item, which has no id and turns on a moment after the text.
- extendedWaitUntil:
    visible:
      text: Import
      enabled: true
    timeout: 10000
# The sheet is still rising with the keyboard, so the item moves under a tap that comes too soon.
- waitForAnimationToEnd
- tapOn: Import
