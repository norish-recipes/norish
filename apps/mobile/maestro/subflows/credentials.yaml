# Signs in on Sign in as NORISH_EMAIL/PASSWORD and waits for Recipes.
appId: dev.norish.app
---
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 20000
- tapOn:
    id: login-email
- inputText: ${NORISH_EMAIL}
- tapOn:
    id: login-password
- inputText: ${NORISH_PASSWORD}
# The password field's Go key submits, so the keyboard stays up and Sign in is tapped as it is.
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: recipes-screen
    timeout: 20000
