# Signs in on the login screen as NORISH_EMAIL/PASSWORD and waits for the smoke screen.
appId: dev.norish.app
---
- tapOn:
    id: login-email
- inputText: ${NORISH_EMAIL}
- tapOn:
    id: login-password
- inputText: ${NORISH_PASSWORD}
- hideKeyboard
- tapOn:
    id: login-submit
# iOS sometimes offers to save the password in a sheet that hides the app beneath it.
- tapOn:
    text: Not Now
    optional: true
- extendedWaitUntil:
    visible:
      id: smoke-user
      text: .*${NORISH_EMAIL}.*
    timeout: 20000
