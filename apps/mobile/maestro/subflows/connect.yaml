# Launches the app fresh and connects it to NORISH_CONNECT_URL, which callers pass via runFlow env.
# Ends on Sign in, or on Server address when the connection fails.
appId: dev.norish.app
---
# The session lives in the keychain, which outlives the app's own data.
- launchApp:
    clearState: true
    clearKeychain: true
# The launch splash plays about two seconds before Server address takes input.
- extendedWaitUntil:
    visible:
      id: connect-server-url
    timeout: 20000
- tapOn:
    id: connect-server-url
- inputText: ${NORISH_CONNECT_URL}
- hideKeyboard
- tapOn:
    id: connect-submit
