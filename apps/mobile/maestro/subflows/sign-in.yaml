# Signs in at NORISH_SIGN_IN_URL, which callers pass via runFlow env and nothing via -e, and
# keeps the session across a relaunch. NORISH_EMAIL/PASSWORD come from the maestro script.
appId: dev.norish.app
---
- runFlow:
    file: connect.yaml
    env:
      NORISH_CONNECT_URL: ${NORISH_SIGN_IN_URL}
- runFlow: credentials.yaml
- extendedWaitUntil:
    visible:
      id: recipes-screen
    timeout: 10000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: recipes-screen
    timeout: 20000
