# Saves recipes on the server and keeps each id as output[key]. Callers pass RECIPES via runFlow env:
# a JSON array of { name, key, ingredients?, tags? }.
appId: dev.norish.app
---
- evalScript: |
    ${
      for (const recipe of json(RECIPES)) {
        const answer = http.post(NORISH_PROXY_CONTROL_URL + '/recipe', {
          body: JSON.stringify({
            name: recipe.name,
            ingredients: recipe.ingredients || [],
            tags: recipe.tags || [],
          }),
        });
        output[recipe.key] = json(answer.body).id;
      }
    }
