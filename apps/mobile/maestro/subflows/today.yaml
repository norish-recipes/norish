# Sets output.slot to the slot Today opens on (breakfast before ten, lunch before two, dinner after)
# and output.today to today's date as the app keys its days (YYYY-MM-DD).
appId: dev.norish.app
---
- evalScript: |
    ${
      const now = new Date();
      const pad = (value) => (value < 10 ? '0' : '') + value;
      output.slot = now.getHours() < 10 ? 'Breakfast' : now.getHours() < 14 ? 'Lunch' : 'Dinner';
      output.today = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
    }
