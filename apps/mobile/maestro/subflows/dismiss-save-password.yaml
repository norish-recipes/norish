# Closes iOS's "Save Password?" sheet, which opens at an unpredictable moment after a sign-in and
# again after the next launch, and hides the app beneath it. Maestro cannot always see this system
# sheet, so Not Now is tapped by position until the smoke screen shows.
appId: dev.norish.app
---
- repeat:
    while:
      notVisible:
        id: smoke-user
    times: 15
    commands:
      - tapOn:
          point: 32%,63%
          optional: true
      - extendedWaitUntil:
          visible:
            id: smoke-user
          timeout: 1500
          optional: true
