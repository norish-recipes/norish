# Another session saves a recipe on the server: its card appears in the open Library with no reload,
# over the realtime socket.
appId: dev.norish.app
---
- runFlow: subflows/reset.yaml
- runFlow:
    file: subflows/recipe.yaml
    env:
      RECIPE_NAME: Realtime Soup
      RECIPE_KEY: soup
- runFlow:
    file: subflows/sign-in.yaml
    env:
      NORISH_SIGN_IN_URL: ${NORISH_SERVER_URL}
- extendedWaitUntil:
    visible:
      id: recipe-card-${output.soup}
    timeout: 20000
- assertNotVisible: Realtime Pie
- runFlow:
    file: subflows/recipe.yaml
    env:
      RECIPE_NAME: Realtime Pie
      RECIPE_KEY: pie
- extendedWaitUntil:
    visible:
      id: recipe-card-${output.pie}
    timeout: 20000
- assertVisible:
    id: recipe-card-${output.soup}
