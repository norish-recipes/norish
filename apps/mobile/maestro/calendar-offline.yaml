# Opens the Calendar with the server unreachable: the days and their planned items come from what the
# app kept, the Calendar says it is offline, and once the server returns the pill goes.
appId: dev.norish.app
---
- runFlow:
    file: subflows/proxy.yaml
    env:
      PROXY_ACTION: restore
- runFlow:
    file: subflows/start.yaml
    env:
      RECIPES: '[{"name": "Offline Plan Roast", "key": "roast"}]'
      NORISH_SIGN_IN_URL: ${NORISH_PROXY_URL}
- runFlow:
    file: subflows/plan.yaml
    env:
      PLAN: '{"recipeName": "Offline Plan Roast", "offset": 1, "slot": "Dinner"}'
- tapOn:
    id: tab-calendar
- extendedWaitUntil:
    visible:
      id: calendar-screen
    timeout: 20000
- scrollUntilVisible:
    element:
      id: calendar-item-.*
      text: Offline Plan Roast.*
- assertNotVisible:
    id: calendar-offline
# Leaving the app saves what it has read.
- pressKey: home
- runFlow:
    file: subflows/proxy.yaml
    env:
      PROXY_ACTION: cut
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-calendar
    timeout: 20000
- tapOn:
    id: tab-calendar
- extendedWaitUntil:
    visible:
      id: calendar-offline
    timeout: 90000
- scrollUntilVisible:
    element:
      id: calendar-item-.*
      text: Offline Plan Roast.*
- runFlow:
    file: subflows/proxy.yaml
    env:
      PROXY_ACTION: restore
# The Offline backoff tops out at 30 seconds between probes.
- extendedWaitUntil:
    notVisible:
      id: calendar-offline
    timeout: 90000
