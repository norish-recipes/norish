# Signs in with a wrong password: Sign in shows its error and stays. The right password then signs in.
appId: dev.norish.app
---
- runFlow:
    file: subflows/connect.yaml
    env:
      NORISH_CONNECT_URL: ${NORISH_SERVER_URL}
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 20000
- tapOn:
    id: login-email
- inputText: ${NORISH_EMAIL}
- tapOn:
    id: login-password
- inputText: ${NORISH_PASSWORD}-wrong
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: login-error
    timeout: 10000
- assertNotVisible:
    id: smoke-user
# Erases the 6 characters of -wrong, which leaves the right password; editing clears the error.
- tapOn:
    id: login-password
- eraseText: 6
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: smoke-user
      text: .*${NORISH_EMAIL}.*
    timeout: 20000
