# Deletes a recipe from its card: swipe, Delete, confirm. The card goes, the other stays and the
# server no longer has the recipe.
appId: dev.norish.app
---
- runFlow:
    file: subflows/start.yaml
    env:
      RECIPES: '[{"name": "Delete Me Stew", "key": "doomed"}, {"name": "Keep Me Salad", "key": "kept"}]'
- extendedWaitUntil:
    visible:
      id: recipe-card-${output.doomed}
    timeout: 20000
- assertVisible:
    id: recipe-card-${output.kept}
# The Library is short, so the last row has to rest clear of the Add recipe accessory in both views.
- tapOn:
    id: library-view-grid
- swipe:
    from:
      id: recipe-card-${output.doomed}
    direction: LEFT
- tapOn:
    id: recipe-swipe-delete-${output.doomed}
# The native alert asks first; cancelling keeps the card.
- tapOn: Cancel
- assertVisible:
    id: recipe-card-${output.doomed}
- tapOn:
    id: library-view-list
- swipe:
    from:
      id: recipe-card-${output.doomed}
    direction: LEFT
- tapOn:
    id: recipe-swipe-delete-${output.doomed}
# The native alert asks first.
- tapOn: Delete
- extendedWaitUntil:
    notVisible:
      id: recipe-card-${output.doomed}
    timeout: 20000
- assertVisible:
    id: recipe-card-${output.kept}
- runFlow:
    file: subflows/count.yaml
    env:
      COUNT_NAME: Delete Me Stew
- assertTrue: ${output.count == 0}
