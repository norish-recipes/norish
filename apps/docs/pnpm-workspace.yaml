# apps/docs is isolated from the monorepo workspace (mirrors apps/quick-import-extension).
# Having its own pnpm-workspace.yaml makes this directory its own install root, so the
# Docusaurus dependency tree never touches the root React 19 catalog. Builds/deploys
# are fully self-contained.
allowBuilds:
  "@swc/core": true
  core-js: true
  core-js-pure: true
  esbuild: false
  workerd: false

# Patched majors for Dependabot alerts the latest upstream still pins below:
# @docusaurus/core 3.10 pins tinypool ^1, copy-webpack-plugin 11 and
# css-minimizer-webpack-plugin 5 pin serialize-javascript ^6, sockjs pins uuid ^8.
overrides:
  tinypool: ^2.1.2
  serialize-javascript: ^7.1.3
  sockjs>uuid: ^11.1.1
