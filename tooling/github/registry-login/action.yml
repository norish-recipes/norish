name: "Registry login"
description: "Log in to Docker Hub, the registry Norish images are published to."

inputs:
  dockerhub-username:
    description: "Docker Hub username."
    required: true
  dockerhub-password:
    description: "Docker Hub password."
    required: true

runs:
  using: composite
  steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: docker.io
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}
