name: RC Release Build and Publish Docker

on:
  push:
    branches:
      - "rc/**"

# Scoped per branch: a single shared "release-rc" group meant two rc/* branches
# cancelled each other's releases, leaving the loser's head commit showing a
# cancelled quality check on its PR.
concurrency:
  group: release-rc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # Needed to export the BuildKit layer cache to GHCR. The image itself still
  # publishes to Docker Hub under DOCKERHUB_* credentials, not this token.
  packages: write

jobs:
  # The tag and the publish below both hang off this job, so nothing ships
  # without it going green.
  quality:
    name: Quality
    uses: ./.github/workflows/_node-ci.yml
    secrets: inherit

  # The tag and the image are named after the root package.json version, so a
  # branch that was cut without bumping it would publish the new release's code
  # under the previous release's tag. Fails in seconds, well before quality.
  version:
    name: Version matches branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Check versions against the rc branch
        run: node tooling/monorepo/scripts/sync-version.mjs --check

  prepare-release:
    name: Create RC tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, version]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Tag computation only needs Node itself, not the workspace install.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Create RC tag
        id: tag
        uses: ./tooling/github/tag-release
        with:
          tag-prefix: rc-v
          require-beta: "true"

  docker-publish:
    name: Publish
    uses: ./.github/workflows/_docker-build.yml
    needs: prepare-release
    secrets: inherit
    with:
      push: true
      primary-image: docker.io/norishapp/norish
      tags: ${{ needs.prepare-release.outputs.tag }}
