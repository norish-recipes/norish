name: RC Release Build and Publish Docker

on:
  push:
    branches:
      - "rc/**"

concurrency:
  group: release-rc
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    name: RC Quality Gates
    uses: ./.github/workflows/_node-ci.yml
    secrets: inherit

  prepare-release:
    name: RC Beta Release Prep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Tag computation only needs Node itself, not the workspace install.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Create RC tag
        id: tag
        uses: ./tooling/github/tag-release
        with:
          tag-prefix: rc-v
          require-beta: "true"

  docker-publish:
    uses: ./.github/workflows/_docker-build.yml
    needs: prepare-release
    secrets: inherit
    with:
      push: true
      primary-image: docker.io/norishapp/norish
      tags: ${{ needs.prepare-release.outputs.tag }}
