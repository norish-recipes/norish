name: RC Release Build and Publish Docker

on:
  push:
    branches:
      - "rc/**"

concurrency:
  group: release-rc
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  quality:
    name: RC Quality Gates
    uses: ./.github/workflows/_node-ci.yml
    secrets: inherit
    with:
      run-build: true
      run-tests: true
      run-e2e: true

  prepare-release:
    name: RC Beta Release Prep
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image_tags: ${{ steps.image_tags.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Tag computation only needs Node itself, not the workspace install.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Create RC tag
        id: tag
        uses: ./tooling/github/tag-release
        with:
          tag-prefix: rc-v
          require-beta: "true"

      - name: Set image tags
        id: image_tags
        run: |
          {
            echo 'value<<EOF'
            echo 'ghcr.io/norish-recipes/norish:${{ steps.tag.outputs.tag }}'
            echo 'docker.io/norishapp/norish:${{ steps.tag.outputs.tag }}'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  docker-publish:
    uses: ./.github/workflows/_docker-build.yml
    needs: prepare-release
    secrets: inherit
    with:
      push: true
      image-tags: ${{ needs.prepare-release.outputs.image_tags }}
