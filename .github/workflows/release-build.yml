name: Release Tag and Promote Docker

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/_node-ci.yml
    secrets: inherit

  prepare-release:
    name: Create release tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      rc_tag: ${{ steps.rc_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Tag computation only needs Node itself, not the workspace install.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Create release tag
        id: tag
        uses: ./tooling/github/tag-release
        with:
          tag-prefix: v

      - name: Compute RC tag name
        id: rc_tag
        run: echo "tag=rc-v${{ steps.tag.outputs.version }}" >> "$GITHUB_OUTPUT"

  docker-promote:
    name: Promote images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: prepare-release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to container registry
        uses: ./tooling/github/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Promote Docker Hub image
        run: |
          SOURCE="docker.io/norishapp/norish:${{ needs.prepare-release.outputs.rc_tag }}"
          VERSION_TAG="docker.io/norishapp/norish:${{ needs.prepare-release.outputs.tag }}"
          docker buildx imagetools create \
            --tag "$VERSION_TAG" \
            --tag "docker.io/norishapp/norish:latest" \
            "$SOURCE"
