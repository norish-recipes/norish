name: PR Quality Checks

on:
  pull_request:
    branches:
      - main
      - "rc/**"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-cycles:
    name: Dependency Cycles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Run circular dependency gate
        run: pnpm run deps:cycles

  quality:
    name: Quality Checks
    uses: ./.github/workflows/_node-ci.yml
    secrets: inherit
    with:
      run-build: true
      run-tests: true
      run-lint: true
      run-format: true
      run-i18n: true
      run-e2e: true
