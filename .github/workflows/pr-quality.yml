name: PR Quality Checks

# Pull requests only. A push to main runs release-build.yml, which gates on the
# same reusable workflow before it tags anything, so a `push: main` trigger here
# would just run every check on that commit a second time.
on:
  pull_request:
    branches:
      - main
      - "rc/**"

permissions:
  contents: read

# A new commit supersedes whatever is still running for the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    # Runs for every PR, including rc/** heads. Those also trigger
    # rc-release-build.yml on push, which gates on this same workflow — but that
    # one sits in a `cancel-in-progress` concurrency group, so a quick follow-up
    # push cancels it. Leaning on it as the only signal left PRs showing nothing
    # but skipped and cancelled checks.
    uses: ./.github/workflows/_node-ci.yml
    secrets: inherit
