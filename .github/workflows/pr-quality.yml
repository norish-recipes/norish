name: PR Quality Checks

# Pull requests only. A push to main runs release-build.yml, which gates on the
# same reusable workflow before it tags anything, so a `push: main` trigger here
# would just run every check on that commit a second time.
on:
  pull_request:
    branches:
      - main
      - "rc/**"

permissions:
  contents: read

# A new commit supersedes whatever is still running for the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    # Skipped when the PR's head is an rc/** branch. Pushing to those fires
    # rc-release-build.yml against the identical SHA, and it gates its tag and
    # publish on that same run — so the work is not just duplicated here, it is
    # duplicated without anything depending on the second copy. Check runs
    # attach to the commit, so the release run's result still lands on this PR.
    if: ${{ !startsWith(github.head_ref, 'rc/') }}
    uses: ./.github/workflows/_node-ci.yml
    secrets: inherit
