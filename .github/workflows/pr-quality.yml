name: PR Quality Checks

env:
  NODE_ENV: production
  DATABASE_URL: postgres://ci-user:ci-password@localhost:5432/ci-db
  MASTER_KEY: test-master-key
  SKIP_ENV_VALIDATION: "1"

on:
  pull_request:
    branches:
      - main
      - "rc/**"
  push:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Run build
        run: pnpm run build

  dependency-cycles:
    name: Dependency Cycles
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Run circular dependency gate
        run: pnpm run deps:cycles

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Run tests
        run: turbo run test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Run lint
        run: turbo run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Run typecheck
        run: turbo run typecheck

  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Run format check
        run: turbo run format

  i18n:
    name: Locale Keys Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Check locale keys
        run: pnpm run i18n:check
