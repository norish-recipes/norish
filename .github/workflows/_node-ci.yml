name: Reusable Node CI

env:
  NODE_ENV: production
  DATABASE_URL: postgres://ci-user:ci-password@localhost:5432/ci-db
  MASTER_KEY: QmFzZTY0RW5jb2RlZE1hc3RlcktleU1pbjMyQ2hhcnM=
  SKIP_ENV_VALIDATION: "1"
  AUTH_URL: http://localhost:3000
  OBSCURA_ENDPOINT: ws://localhost:9222

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The gates share one job on purpose. Actions jobs do not share a
  # filesystem, so every extra job pays another checkout plus a full
  # `pnpm install`, and any build it depends on has to be redone. Running them
  # in sequence costs a few minutes of wall clock and saves the reinstalls.
  # The browser E2E is the exception: at ~20 minutes it was two thirds of the
  # run, so it is sharded across jobs below and pays its own install and build
  # in each, in parallel with this one.
  verify:
    # Named for what it runs, not for its role: this is the only check covering
    # the unit tests now that they are steps rather than their own job, and
    # "Verify" gave no hint that a red here could be a failing test.
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The unit tests whose code publishes realtime events need a live Valkey, as the dev stack gives
    # them locally; without one each publish waits out the client's 5 s command timeout.
    services:
      valkey:
        image: valkey/valkey:9
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain and install dependencies
        id: setup
        uses: ./tooling/github/setup

      # Gate order is cheapest-first so a trivial break reports in a minute
      # instead of behind the build.
      #
      # Each gate is guarded on the *install* rather than on the gate before
      # it, so one red gate still lets the rest report. That preserves what the
      # old `fail-fast: false` matrix gave us now that they share a job.
      - name: Dependency cycles
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run deps:cycles

      # "format:check", not "format" — the latter writes, which on a throwaway
      # checkout means the gate reformats the runner's copy and then passes
      # whatever the branch happens to look like.
      - name: Format check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run format:check

      - name: Locale keys check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run i18n:check

      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run lint

      - name: Type check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run typecheck

      # The parser's own tests run under uv, as the E2E job installs it.
      - name: Install uv
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-dependency-glob: apps/parser-api/uv.lock

      - name: Install the embedded parser runtime
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm --filter @norish/parser-api run install:deps

      # Unit tests need NODE_ENV=test: under the workflow-wide "production"
      # Vite resolves Node builtins as browser externals, and every jsdom suite
      # that reaches one dies with "No such built-in module: node:" before a
      # single test runs.
      - name: Tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run test
        env:
          NODE_ENV: test

      - name: Build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run build

      # The landing deploy runs this wrangler from the lockfile; a broken install
      # shows here instead of on the next deploy.
      - name: Wrangler
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm --filter @norish/landing exec wrangler --version

  # One Playwright worker per shard (see the E2E config): a worker is a whole
  # stack, and a second one on a 4-vCPU runner slows both into timing reds.
  # Shards split at file granularity while `fullyParallel` is off, so a
  # serial spec stays whole, and are balanced by test count, not duration:
  # when one runs well past the main job, add a shard rather than reordering.
  e2e:
    name: Browser E2E (${{ matrix.shard == 'base-path' && 'base path' || format('{0}/4', matrix.shard) }})
    runs-on: ubuntu-latest
    # On 2026-10-05 the unsharded suite hit 30 minutes at test 130 of 147.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # A build for a base path runs only the base-path project (see the E2E config).
        shard: [1, 2, 3, 4, base-path]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      # The suites boot the server's source with the built .next (the harness at
      # apps/web/__tests__/e2e/harness/production-stack.ts), so the web app and
      # what it depends on is all a shard builds.
      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ matrix.shard == 'base-path' && '/norish' || '' }}
        run: pnpm run build --filter=@norish/web...

      - name: Install Playwright browsers
        run: pnpm --filter @norish/web exec playwright install --with-deps chromium

      # setup-uv stopped publishing floating major tags with v8; pin exactly.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        # Its default cache key globs the whole checkout, following pnpm 12's workspace symlinks in
        # node_modules back into the repo until the job times out.
        with:
          cache-dependency-glob: apps/parser-api/uv.lock

      # The production server boots the embedded parser and refuses to run
      # without its runtime; the shared setup skips it for everything else.
      - name: Install the embedded parser runtime
        run: pnpm --filter @norish/parser-api run install:deps

      - name: Browser E2E
        run: pnpm --filter @norish/web run test:e2e ${{ matrix.shard != 'base-path' && format('--shard={0}/4', matrix.shard) || '' }}

      - name: Upload traces and results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.shard }}
          path: apps/web/__tests__/e2e/.results
          retention-days: 7
          if-no-files-found: ignore
          # Everything lives under dot-directories, which the action skips
          # by default — without this the upload silently finds nothing.
          include-hidden-files: true
