name: Reusable Node CI

env:
  NODE_ENV: production
  DATABASE_URL: postgres://ci-user:ci-password@localhost:5432/ci-db
  MASTER_KEY: QmFzZTY0RW5jb2RlZE1hc3RlcktleU1pbjMyQ2hhcnM=
  SKIP_ENV_VALIDATION: "1"
  AUTH_URL: http://localhost:3000
  CHROME_WS_ENDPOINT: ws://localhost:3000

on:
  workflow_call:
    inputs:
      run-build:
        required: false
        type: boolean
        default: false
      run-tests:
        required: false
        type: boolean
        default: false
      run-lint:
        required: false
        type: boolean
        default: false
      run-format:
        required: false
        type: boolean
        default: false
      run-i18n:
        required: false
        type: boolean
        default: false
      run-e2e:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: ${{ inputs.run-build || inputs.run-tests || inputs.run-lint || inputs.run-format || inputs.run-i18n || inputs.run-e2e }}
    runs-on: ubuntu-latest
    outputs:
      gates-matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Run build
        run: pnpm run build

      # Which simple gates (one pnpm command on a fresh checkout) the caller
      # asked for. Computed here so the matrix job below needs no extra runner.
      - name: Plan gate matrix
        id: plan
        run: |
          entries=()
          # Each gate carries the NODE_ENV it runs under. Unit tests need "test":
          # under the workflow-wide "production" Vite resolves Node builtins as
          # browser externals, and every jsdom suite that reaches one dies with
          # "No such built-in module: node:" before a single test runs.
          #
          # Format Check runs "format:check", not "format" — the latter writes,
          # which on a throwaway checkout means the gate reformats the runner's
          # copy and passes whatever the branch looks like.
          if ${{ inputs.run-tests }}; then entries+=('{"name":"Tests","command":"pnpm run test","nodeEnv":"test"}'); fi
          if ${{ inputs.run-lint }}; then entries+=('{"name":"Lint","command":"pnpm run lint","nodeEnv":"production"}'); fi
          if ${{ inputs.run-format }}; then entries+=('{"name":"Format Check","command":"pnpm run format:check","nodeEnv":"production"}'); fi
          if ${{ inputs.run-i18n }}; then entries+=('{"name":"Locale Keys Check","command":"pnpm run i18n:check","nodeEnv":"production"}'); fi
          if [ ${#entries[@]} -eq 0 ]; then
            matrix='[]'
          else
            matrix=$(printf '%s\n' "${entries[@]}" | jq -cs '.')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  gates:
    # Each leg keeps its historical job name (Tests, Lint, Format Check, Locale
    # Keys Check) so existing required-check contexts stay stable.
    name: ${{ matrix.name }}
    if: ${{ needs.build.outputs.gates-matrix != '[]' }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.gates-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
        env:
          NODE_ENV: ${{ matrix.nodeEnv }}

  e2e:
    name: Browser E2E
    if: ${{ inputs.run-e2e }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Install Playwright browsers
        run: pnpm --filter @norish/web exec playwright install --with-deps chromium

      # setup-uv stopped publishing floating major tags with v8; pin exactly.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      # The production server boots the embedded parser and refuses to run
      # without its runtime; the shared setup skips it for every other job.
      - name: Install the embedded parser runtime
        run: pnpm --filter @norish/parser-api run install:deps

      - name: Run browser E2E suites
        run: pnpm run test:e2e

      - name: Upload traces and results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            apps/web/e2e/.results
            apps/web/e2e-ai/.results
          retention-days: 7
          if-no-files-found: ignore
          # Everything lives under dot-directories, which the action skips
          # by default — without this the upload silently finds nothing.
          include-hidden-files: true
