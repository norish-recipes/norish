name: Reusable Node CI

env:
  NODE_ENV: production
  DATABASE_URL: postgres://ci-user:ci-password@localhost:5432/ci-db
  MASTER_KEY: QmFzZTY0RW5jb2RlZE1hc3RlcktleU1pbjMyQ2hhcnM=
  SKIP_ENV_VALIDATION: "1"
  AUTH_URL: http://localhost:3000
  CHROME_WS_ENDPOINT: ws://localhost:3000

on:
  workflow_call:
    inputs:
      run-build:
        required: false
        type: boolean
        default: false
      run-tests:
        required: false
        type: boolean
        default: false
      run-lint:
        required: false
        type: boolean
        default: false
      run-format:
        required: false
        type: boolean
        default: false
      run-i18n:
        required: false
        type: boolean
        default: false
      run-e2e:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  install:
    name: Install dependencies
    if: ${{ inputs.run-build || inputs.run-tests || inputs.run-lint || inputs.run-format || inputs.run-i18n || inputs.run-e2e }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

  build:
    name: Build
    if: ${{ inputs.run-build || inputs.run-tests || inputs.run-lint || inputs.run-format || inputs.run-i18n || inputs.run-e2e }}
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Run build
        run: pnpm run build

  tests:
    name: Tests
    if: ${{ inputs.run-tests }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Run tests
        run: pnpm run test

  lint:
    name: Lint
    if: ${{ inputs.run-lint }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Run lint
        run: pnpm run lint

  format:
    name: Format Check
    if: ${{ inputs.run-format }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Run format check
        run: pnpm run format

  e2e:
    name: Browser E2E
    if: ${{ inputs.run-e2e }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Install Playwright browsers
        run: pnpm --filter @norish/web exec playwright install --with-deps chromium

      # setup-uv stopped publishing floating major tags with v8; pin exactly.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      # The production server boots the embedded parser and refuses to run
      # without its runtime; the shared setup skips it for every other job.
      - name: Install the embedded parser runtime
        run: pnpm --filter @norish/parser-api run install:deps

      - name: Run browser E2E suites
        run: pnpm run test:e2e

      - name: Upload traces and results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            apps/web/e2e/.results
            apps/web/e2e-ai/.results
          retention-days: 7
          if-no-files-found: ignore
          # Everything lives under dot-directories, which the action skips
          # by default — without this the upload silently finds nothing.
          include-hidden-files: true

  i18n:
    name: Locale Keys Check
    if: ${{ inputs.run-i18n }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup

      - name: Check locale keys
        run: pnpm run i18n:check
