name: Deploy Landing

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only one landing deploy at a time; let the newest win.
concurrency:
  group: "landing-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      # norish.dev serves from the root, so no basePath.
      # For a subpath deploy (e.g. a *.pages.dev preview path), set this to e.g. "/norish".
      NEXT_PUBLIC_BASE_PATH: ""
      # The shared install fetches the private @heroui-pro/react used by apps/web.
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup
        with:
          # Only install the landing app and its workspace deps, not the whole monorepo.
          install-filter: "@norish/landing..."

      - name: Build static export
        run: pnpm --filter @norish/landing run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main marks this as a production deploy (matches the project's
          # production branch), so it publishes to norish.dev.
          command: pages deploy apps/landing/out --project-name=norish --branch=main
