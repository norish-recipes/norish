name: Deploy Landing

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only one landing deploy at a time; let the newest win.
concurrency:
  group: "landing-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      # norish.dev serves from the root, so no basePath.
      # For a subpath deploy (e.g. a *.pages.dev preview path), set this to e.g. "/norish".
      NEXT_PUBLIC_BASE_PATH: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain and install dependencies
        uses: ./tooling/github/setup
        with:
          # Only install the landing app and its workspace deps, not the whole monorepo.
          install-filter: "@norish/landing..."

      - name: Build static export
        run: pnpm --filter @norish/landing run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # wrangler is a devDependency of the landing app, so this job runs the
        # release the lockfile records, integrity hash included; it holds the
        # Cloudflare token. --branch=main marks this as a production deploy
        # (matches the project's production branch), so it publishes to norish.dev.
        working-directory: apps/landing
        run: pnpm exec wrangler pages deploy out --project-name=norish --branch=main
