name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      # The docs read the product's colour tokens from here.
      - "tooling/tailwind/heroui-theme.css"
      # The intro lists the languages from here.
      - "packages/i18n/src/locales.ts"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only one docs deploy at a time; let the newest win.
concurrency:
  group: "docs-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy docs to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # apps/docs is isolated from the monorepo workspace (own lockfile), so we
      # install it standalone instead of reusing ./tooling/github/setup.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: apps/docs
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # wrangler is a devDependency of the docs site, locked in its own
        # lockfile with its integrity hash. --branch=main marks this as a
        # production deploy to the norish-docs project.
        working-directory: apps/docs
        run: pnpm exec wrangler pages deploy build --project-name=norish-docs --branch=main
